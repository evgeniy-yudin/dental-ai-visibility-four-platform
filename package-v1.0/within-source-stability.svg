<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description"><title id="title">Repeated dental questions: cited-source stability</title><desc id="description">Mean within-exact-query Jaccard from the fixed US dental panel. Black bars represent exact URL sets and green bars represent source-hostname sets. Larger overlap is not better clinical quality. ChatGPT: URL 29.0%, hostname 39.3%. Gemini: URL 20.1%, hostname 24.8%. Google AI Overviews: URL 23.4%, hostname 30.5%. Google AI Mode: URL 27.8%, hostname 45.4%.</desc><rect width="1200" height="630" fill="#fff"/><g font-family="Arial, sans-serif" fill="#101713"><text x="48" y="48" font-size="15" font-weight="700" letter-spacing="2">ROTGAR RESEARCH · US DENTAL</text><text x="48" y="88" font-size="29" font-weight="700">Repeated questions did not imply identical source sets</text><text x="48" y="136" font-size="21" font-weight="700">ChatGPT</text><text x="48" y="163" font-size="13" fill="#52635c">54 defined hostname pairs</text><rect x="350" y="117" width="550" height="22" fill="#edf1ef"/><rect x="350" y="153" width="550" height="22" fill="#edf1ef"/><rect x="350" y="117" width="159.5459052547873" height="22" fill="#171b20"/><rect x="350" y="153" width="215.90926684063933" height="22" fill="#087653"/><text x="920" y="135" font-size="18">29.0%</text><text x="920" y="171" font-size="18">39.3%</text><text x="48" y="241" font-size="21" font-weight="700">Gemini</text><text x="48" y="268" font-size="13" fill="#52635c">54 defined hostname pairs</text><rect x="350" y="222" width="550" height="22" fill="#edf1ef"/><rect x="350" y="258" width="550" height="22" fill="#edf1ef"/><rect x="350" y="222" width="110.7234714873604" height="22" fill="#171b20"/><rect x="350" y="258" width="136.1904761904762" height="22" fill="#087653"/><text x="920" y="240" font-size="18">20.1%</text><text x="920" y="276" font-size="18">24.8%</text><text x="48" y="346" font-size="21" font-weight="700">Google AI Overviews</text><text x="48" y="373" font-size="13" fill="#52635c">5 defined hostname pairs</text><rect x="350" y="327" width="550" height="22" fill="#edf1ef"/><rect x="350" y="363" width="550" height="22" fill="#edf1ef"/><rect x="350" y="327" width="128.85714285714286" height="22" fill="#171b20"/><rect x="350" y="363" width="167.79365079365078" height="22" fill="#087653"/><text x="920" y="345" font-size="18">23.4%</text><text x="920" y="381" font-size="18">30.5%</text><text x="48" y="451" font-size="21" font-weight="700">Google AI Mode</text><text x="48" y="478" font-size="13" fill="#52635c">52 defined hostname pairs</text><rect x="350" y="432" width="550" height="22" fill="#edf1ef"/><rect x="350" y="468" width="550" height="22" fill="#edf1ef"/><rect x="350" y="432" width="152.76518620268618" height="22" fill="#171b20"/><rect x="350" y="468" width="249.7413003663003" height="22" fill="#087653"/><text x="920" y="450" font-size="18">27.8%</text><text x="920" y="486" font-size="18">45.4%</text><rect x="48" y="563" width="16" height="16" fill="#171b20"/><text x="75" y="577" font-size="16">Exact URLs</text><rect x="226" y="563" width="16" height="16" fill="#087653"/><text x="253" y="577" font-size="16">Source hostnames</text><text x="48" y="611" font-size="13" fill="#52635c">Defined answer pairs only; empty/empty source sets are undefined. Same-day exploratory panel, not a ranking-factor test.</text></g></svg>