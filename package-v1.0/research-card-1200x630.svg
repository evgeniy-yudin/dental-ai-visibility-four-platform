<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">US dental AI search: repeated source overlap</title><desc id="desc">Mean cited-hostname Jaccard across repeated exact dental questions. ChatGPT: 39.3%, 54 defined pairs. Gemini: 24.8%, 54 defined pairs. Google AI Overviews: 30.5%, 5 defined pairs. Google AI Mode: 45.4%, 52 defined pairs. This is source overlap, not a visibility or quality score.</desc><rect width="1200" height="630" fill="#f5f6f2"/><rect x="0" width="14" height="630" fill="#087653"/><g font-family="Arial, sans-serif" fill="#101714"><text x="55" y="55" font-size="19" letter-spacing="4" font-weight="700">ROTGAR RESEARCH</text><text x="55" y="130" font-size="59" font-weight="900">US DENTAL</text><text x="55" y="185" font-size="36" font-weight="700">Same questions. Four AI source sets.</text><text x="55" y="227" font-size="20" fill="#4b5851">Cited-hostname overlap when the exact question was repeated</text><text x="55" y="295" font-size="21" font-weight="700">ChatGPT</text><rect x="300" y="274" width="690" height="32" rx="4" fill="#e0e7e0"/><rect x="300" y="274" width="270.8679893091657" height="32" rx="4" fill="#087653"/><text x="1020" y="299" font-size="29" font-weight="800">39.3%</text><text x="55" y="362" font-size="21" font-weight="700">Gemini</text><rect x="300" y="341" width="690" height="32" rx="4" fill="#e0e7e0"/><rect x="300" y="341" width="170.85714285714286" height="32" rx="4" fill="#087653"/><text x="1020" y="366" font-size="29" font-weight="800">24.8%</text><text x="55" y="429" font-size="21" font-weight="700">Google AI Overviews</text><rect x="300" y="408" width="690" height="32" rx="4" fill="#e0e7e0"/><rect x="300" y="408" width="210.5047619047619" height="32" rx="4" fill="#087653"/><text x="1020" y="433" font-size="29" font-weight="800">30.5%</text><text x="55" y="496" font-size="21" font-weight="700">Google AI Mode</text><rect x="300" y="475" width="690" height="32" rx="4" fill="#e0e7e0"/><rect x="300" y="475" width="313.3118131868131" height="32" rx="4" fill="#087653"/><text x="1020" y="500" font-size="29" font-weight="800">45.4%</text><text x="55" y="581" font-size="20" font-weight="700">216 planned checks · 18 questions · 3 US cities · October 2026</text><text x="55" y="610" font-size="15" fill="#4b5851">Mean pairwise Jaccard; nonempty source union. Source overlap is not a ranking-factor or answer-quality score.</text><text x="55" y="317" font-size="13" fill="#4b5851">54 defined source pairs</text><text x="55" y="384" font-size="13" fill="#4b5851">54 defined source pairs</text><text x="55" y="451" font-size="13" fill="#4b5851">5 defined source pairs</text><text x="55" y="518" font-size="13" fill="#4b5851">52 defined source pairs</text></g></svg>